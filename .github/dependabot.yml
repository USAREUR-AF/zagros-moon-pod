# Weekly dependency updates: one grouped pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /clients/connect/go
      - /clients/examples/modern/go
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /clients/connect/rust
      - /clients/examples/modern/rust
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /clients/examples/modern/typescript
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /clients/examples/bridges/rest-http
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
