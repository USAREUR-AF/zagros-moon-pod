name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# Supersede an in-flight run for the same ref, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Developer Certificate of Origin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit carries a Signed-off-by that matches its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          fail=0
          # Merge commits add no authored content and can't carry a sign-off.
          while read -r sha; do
            [ -n "${sha}" ] || continue
            name=$(git log -1 --format='%an' "${sha}")
            email=$(git log -1 --format='%ae' "${sha}")
            body=$(git log -1 --format='%B' "${sha}")
            # Dependabot can't sign off. Exempt only its own commits on its own pull
            # requests: an author email alone can be spoofed, the opener can't.
            if [ "${PR_USER}" = "dependabot[bot]" ] \
               && [ "${email}" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              echo "note: ${sha} is Dependabot's, on Dependabot's pull request"
              continue
            fi
            if grep -qiF "Signed-off-by: ${name} <${email}>" <<<"${body}"; then
              continue
            fi
            # A squash merge rewrites the author to the noreply alias
            # <id>+<login>@users.noreply.github.com, while the body keeps the sign-off
            # with the real address. Accept it when the alias's login names the signer.
            case "${email}" in
              *+*@users.noreply.github.com)
                login="${email#*+}"; login="${login%@users.noreply.github.com}"
                if grep -qiE "^Signed-off-by:[[:space:]]+${login}[[:space:]]+<.+@.+>" <<<"${body}"; then
                  continue
                fi ;;
            esac
            echo "::error::commit ${sha} has no 'Signed-off-by: ${name} <${email}>'."
            echo "Add it with git commit --amend -s (or git rebase --signoff), then push again."
            fail=1
          done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}")
          exit "${fail}"
