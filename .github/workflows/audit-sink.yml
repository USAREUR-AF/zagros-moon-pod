name: audit-sink

# Stands the pod up through host/first-boot.sh with a synthetic CA and pod leaf and proves the
# audit sink runs: not restarting, metrics on :9303, session open, and a publish into the pod's
# namespace counted.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-sink:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: audit sink starts with the pod, subscribes and counts
        run: bash tests/audit-sink-local.sh
