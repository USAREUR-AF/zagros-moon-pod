# OpenSSF Scorecard: an independent score of this repository's supply-chain practices,
# published to the public Scorecard API (the README badge reads it) and, where code
# scanning is available, uploaded as code scanning results.
#
# Scorecard publishes results only for a public repository, so the job runs only there.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # weekly, so the score tracks new advisories and settings
  branch_protection_rule:  # re-score when protection changes
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    if: ${{ !github.event.repository.private }}
    # The Scorecard API accepts results only from a job on a GitHub-hosted Ubuntu runner,
    # with no env, defaults, containers or run steps, and only allowlisted actions.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      security-events: write   # upload the results to code scanning
      id-token: write          # publish the results to the Scorecard API
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
