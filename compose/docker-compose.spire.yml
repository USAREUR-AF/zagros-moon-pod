# moon-pod — SPIRE/SPIFFE workload-identity + federation overlay (Phase 3+, optional).
#
# Compose OVERLAY, layered on top of compose/docker-compose.yml:
#
#   docker compose -f compose/docker-compose.yml -f compose/docker-compose.spire.yml up -d
#
# What it adds — entirely INSIDE the pod, on partner hardware:
#   * spire-server  — the pod's OWN trust domain (spiffe://<partner>.pod), its own root CA.
#   * spire-agent   — attests the pod's containers (docker workload attestor) + fetches SVIDs.
#   * spiffe-helper — a sidecar that writes the zenoh-router a CN-bearing X509-SVID, auto-rotated,
#                     replacing the static portal-minted leaf with a SPIRE-issued one.
#
# Federation: spire-server federates_with the zagros trust domain (spiffe://<goatnet-trust-domain>),
# exchanging only PUBLIC trust bundles. The pod issues + rotates its own workload SVIDs locally and
# NEVER calls the goat core for certs; the goat side verifies the pod's federated identity. See
# docs/spire-federation-overlay.md for the run steps, the bundle bootstrap, and the reciprocal
# goat-side config. This is the ADR 0412 (addendum 2026-06-19) partner-pod federation, made real.
#
# Sovereignty: the partner CA private key never leaves the pod. Each side's SPIRE is a SPOF for its
# OWN domain only — federation contains the SPOF, it does not create or remove one.
#
# Images: digest-pinned (ADR 0859) known-good versions — SPIRE 1.11.2
# (server+agent) + spiffe-helper 0.10.1, multi-arch INDEX digests resolved from ghcr.io.

services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.11.2@sha256:0ca091ecef5cbc19f2900a789f68ff5c00a31b056768468c6f2d4c3160a7f03c
    container_name: goat-moon-spire-server
    network_mode: host
    restart: unless-stopped
    # -expandEnv so ${POD_TRUST_DOMAIN} / ${ZAGROS_SPIRE_BUNDLE_ENDPOINT} resolve from the env.
    command: ["-config", "/run/spire/conf/server.conf", "-expandEnv"]
    environment:
      - POD_TRUST_DOMAIN=${POD_TRUST_DOMAIN:?set in .env, e.g. spiffe://CHANGE-ME.pod}
      - ZAGROS_SPIRE_BUNDLE_ENDPOINT=${ZAGROS_SPIRE_BUNDLE_ENDPOINT:?set in .env}
    volumes:
      - ${POD_STATE_DIR:?set in .env}/spire/server.conf:/run/spire/conf/server.conf:ro
      - ${POD_STATE_DIR}/spire/data/server:/opt/spire/data/server
      # The zagros public bundle, seeded once out-of-band (see docs/spire-federation-overlay.md).
      - ${POD_STATE_DIR}/spire/zagros-bundle.pem:/run/spire/conf/zagros-bundle.pem:ro
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.11.2@sha256:7561ee91bfe07812f335d5b9e564bbb2ab77ef601558898a23177f692db15fc1
    container_name: goat-moon-spire-agent
    network_mode: host
    restart: unless-stopped
    pid: host                       # docker workload attestor needs to see host PIDs
    depends_on:
      spire-server:
        condition: service_healthy
    command: ["-config", "/run/spire/conf/agent.conf", "-expandEnv"]
    environment:
      - POD_TRUST_DOMAIN=${POD_TRUST_DOMAIN:?set in .env}
    volumes:
      - ${POD_STATE_DIR}/spire/agent.conf:/run/spire/conf/agent.conf:ro
      - ${POD_STATE_DIR}/spire/data/agent:/opt/spire/data/agent
      - ${POD_STATE_DIR}/spire/agent-sock:/run/spire/sock        # Workload API socket dir
      - /var/run/docker.sock:/var/run/docker.sock:ro             # docker workload attestor

  # Sidecar: fetches the router's SVID from the Workload API and writes it where the router reads
  # its mTLS leaf — so the router presents a SPIRE-issued, auto-rotated, CN-bearing cert instead of
  # the static portal-minted one. The registration entry sets the SVID's Subject CN (via dns_names)
  # to the pod's zagros slot ACL subject, so the goat-side CN-keyed ACL admits it unchanged.
  spire-helper-router:
    image: ghcr.io/spiffe/spiffe-helper:0.10.1@sha256:2402c34d83794aa24c127baa46e9732d653463f3bfcd39cda1313003ed60f8c9
    container_name: goat-moon-spire-helper-router
    network_mode: host
    restart: unless-stopped
    depends_on:
      spire-agent:
        condition: service_started
    command: ["-config", "/run/spire/conf/spiffe-helper.conf"]
    volumes:
      - ${POD_STATE_DIR}/spire/spiffe-helper.conf:/run/spire/conf/spiffe-helper.conf:ro
      - ${POD_STATE_DIR}/spire/agent-sock:/run/spire/sock:ro      # Workload API socket (shared)
      - ${POD_STATE_DIR}/zenoh/tls:/svid                          # writes pod-cert/key (never ca-roots)
