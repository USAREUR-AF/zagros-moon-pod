# moon-pod SPIRE agent — attests the pod's containers and serves the Workload API.
# Consumed by compose/docker-compose.spire.yml (-expandEnv resolves ${POD_TRUST_DOMAIN}).

agent {
    data_dir          = "/opt/spire/data/agent"
    log_level         = "INFO"
    server_address    = "127.0.0.1"
    server_port       = "8081"
    trust_domain      = "${POD_TRUST_DOMAIN}"
    # The Workload API socket the spiffe-helper sidecar(s) connect to (shared volume).
    socket_path       = "/run/spire/sock/agent.sock"
    # Bootstrap trust: the agent is seeded with the server's bundle out-of-band (see the
    # overlay doc) — NOT insecure_bootstrap. The one-time join token is passed at first run.
    insecure_bootstrap = false
    trust_bundle_path  = "/opt/spire/data/agent/bootstrap-bundle.pem"
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # The agent's own key — memory is fine; the agent SVID is re-fetched from the server.
    KeyManager "memory" {
        plugin_data {}
    }

    # Attest the pod's containers by docker label / image, so each gets its own SVID.
    WorkloadAttestor "docker" {
        plugin_data {}
    }
}
