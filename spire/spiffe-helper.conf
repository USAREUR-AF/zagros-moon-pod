# moon-pod spiffe-helper — writes the zenoh-router a CN-bearing X509-SVID.
#
# Fetches the router's SVID from the SPIRE agent Workload API and writes the leaf where the
# router reads its mTLS identity (the same files the static portal-minted cert used). On
# rotation it rewrites them and (optionally) signals the router. The SVID's Subject CN is set
# to the pod's zagros slot ACL subject via the registration entry's dns_names — so the goat-side
# CN-keyed Zenoh ACL admits it UNCHANGED (the CN-bearing-SVID bridge the goat side already
# accepts).

agent_address    = "/run/spire/sock/agent.sock"

# Where the router reads its leaf (bind-mounted to ${POD_STATE_DIR}/zenoh/tls in the overlay).
# The helper replaces ONLY the leaf + key. It must NEVER write ca-roots.pem: that file is the
# bundle-derived root set the router verifies the GOAT side against, and overwriting it with the
# pod's own-domain bundle breaks goat-side verification. spiffe-helper 0.10.1 cannot write
# federated bundles to a separate file (no such option exists, and unknown keys are fatal at
# startup), so pod-domain-bundle.pem stays own-domain-only and the federated (zagros) roots never
# enter the helper's output; point the router at it only where a config explicitly wants
# SPIRE-anchored verification.
cert_dir              = "/svid"
svid_file_name        = "pod-cert.pem"
svid_key_file_name    = "pod-key.pem"
svid_bundle_file_name = "pod-domain-bundle.pem"
# true would merge the federated (zagros) roots INTO the file above — keep the domains separate.
include_federated_domains = false

# Rotation: the helper rewrites the files, but zenohd reads its TLS material once at startup and
# the stock spiffe-helper image has no way to reach the router container — so renew_signal stays
# empty and a rotation needs `sudo docker restart goat-moon-zenoh-router` (see the overlay doc).
renew_signal = ""
