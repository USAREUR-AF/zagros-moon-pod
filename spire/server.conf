# moon-pod SPIRE server — the pod's OWN trust domain, federating with zagros.
# Rendered/consumed by compose/docker-compose.spire.yml (started with -expandEnv so
# ${POD_TRUST_DOMAIN} / ${ZAGROS_SPIRE_BUNDLE_ENDPOINT} resolve from the container env).
#
# Single-pod: sqlite datastore + disk KeyManager (the pod's own root CA). The partner CA
# private key lives ONLY here, on partner hardware. HA (a second server) is the partner's
# own call and orthogonal to federation (ADR 0412 addendum 2026-06-19).

server {
    bind_address          = "127.0.0.1"
    bind_port             = "8081"
    trust_domain          = "${POD_TRUST_DOMAIN}"
    data_dir              = "/opt/spire/data/server"
    log_level             = "INFO"
    # Long CA TTL keeps cross-domain bundle refresh infrequent; short SVID TTL keeps a
    # leaked workload cert useless in ~an hour.
    ca_ttl                = "2160h"
    default_x509_svid_ttl = "1h"
    agent_ttl             = "360h"

    # --- Federation: exchange PUBLIC trust bundles with the zagros trust domain. ---
    # The pod serves its own bundle on :8443 (https_spiffe) and pulls zagros's from zagros's
    # bundle endpoint. Only public keys cross — never SVIDs, never the CA key. Each side's
    # bundle is seeded once out-of-band (see docs/spire-federation-overlay.md), then refreshed
    # automatically on the CA-TTL cadence.
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port    = 8443
        }
        federates_with "spiffe://zagros.zagros.example" {
            bundle_endpoint_url = "https://${ZAGROS_SPIRE_BUNDLE_ENDPOINT}"
            bundle_endpoint_profile "https_spiffe" {
                endpoint_spiffe_id = "spiffe://zagros.zagros.example/spire/server"
            }
        }
    }
}

plugins {
    # Single-pod: sqlite is plenty.
    DataStore "sql" {
        plugin_data {
            database_type     = "sqlite3"
            connection_string = "/opt/spire/data/server/datastore.sqlite3"
        }
    }

    # join_token is the minimal bare-host attestor. The agent is given a
    # one-time token at first boot (see the overlay doc). Harden to x509pop/docker chained off
    # the pod's machine identity when the pod hardens past the sandbox.
    NodeAttestor "join_token" {
        plugin_data {}
    }

    # Disk KeyManager so the pod's CA key persists across restarts (a memory KeyManager would
    # mint a NEW CA on restart, invalidating every issued SVID and the federated bundle).
    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/server/keys.json"
        }
    }
}
